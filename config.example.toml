# This is NOT an upstream ssh-mcp config. Unknown fields are rejected.
# Save the real file with mode 0600 in a private directory.
[defaults]
defaultProfile = "local"
connectTimeoutMs = 10000
commandTimeoutMs = 60000
commandMaxOutputBytes = 65536
transferMaxBytes = 1048576
maxConcurrentCalls = 4
# Optional existing private directory; stderr is used when omitted.
# auditPath = "/home/developer/.local/state/ssh-mcp-rs/audit.jsonl"

[[profiles]]
name = "local"
host = "127.0.0.1"
port = 22
user = "developer"
keyRef = "/home/developer/.ssh/id_ed25519"
# REPLACE with a verified SHA256 host public-key fingerprint, not a network TOFU scan.
hostKeySha256 = "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
readOnly = true
approvalPolicy = "deny"
# passphraseEnv = "SSH_MCP_KEY_PASSPHRASE"

# Explicit opt-in example; UNCOMMENT ONLY after testing the authenticated
# client's confirmation behavior. It is NOT a server-side per-call approval gate.
