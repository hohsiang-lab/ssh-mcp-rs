# This is NOT an upstream ssh-mcp config. Unknown fields are rejected.
# Save the real file with mode 0600 in a private directory.
[defaults]
defaultProfile = "local"
connectTimeoutMs = 10000
commandTimeoutMs = 60000
commandMaxOutputBytes = 65536
transferMaxBytes = 1048576
# Optional: required only for binary file transfer tools. Create private 0700 directory.
# transferRoot = "/srv/mcp-transfers"
transferFileMaxBytes = 268435456
transferTimeoutMs = 300000
maxConcurrentCalls = 4
# Optional existing private directory; stderr is used when omitted.
# auditPath = "/home/developer/.local/state/ssh-mcp-rs/audit.jsonl"

[[profiles]]
name = "local"
host = "127.0.0.1"
port = 22
user = "developer"
keyRef = "/home/developer/.ssh/id_ed25519"
# REPLACE with a verified SHA256 host public-key fingerprint, not a network TOFU scan.
hostKeySha256 = "SHA256:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
# Explicitly set the environment; names containing local/dev/test infer dev, others prod.
role = "operator"   # viewer | operator | admin, or custom bindings
group = "prod"     # prod | staging | dev, or custom bindings
readOnly = true
approvalPolicy = "deny"
allowPrivileged = false
# passphraseEnv = "SSH_MCP_KEY_PASSPHRASE"

# Explicit opt-in example; UNCOMMENT ONLY after testing the authenticated
# client's confirmation behavior. It is NOT a server-side per-call approval gate.
# [[profiles]]
# name = "dev"
# host = "127.0.0.1"
# port = 22
# user = "developer"
# keyRef = "/home/developer/.ssh/id_ed25519"
# hostKeySha256 = "SHA256:REPLACE_WITH_VERIFIED_HOST_KEY_FINGERPRINT"
# readOnly = false
# approvalPolicy = "client-confirmation"
# role = "operator"
# group = "dev"
# allowPrivileged = false  # true explicitly enables the sudo helper; sudoers still applies

# Optional additional policy restrictions. Regex patterns also inspect SFTP remote paths.
# [policy]
# denylist = ['^terraform\\s+destroy', 'authorized_keys$']
#
# [policy.roleBindings.operator]
# prod = ["read-only", "safe"]
