[package]
name = "ssh-mcp-rs"
version = "0.3.0"
edition = "2024"
rust-version = "1.89"
description = "Rust SSH MCP server with explicit client-managed confirmation"
license = "MIT"
repository = "https://github.com/hohsiang-lab/ssh-mcp-rs"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
regex = "1"
rmcp = { version = "3.10.0", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
rquickjs = "0.14.0"
russh = { version = "0.65.2", default-features = false, features = ["ring", "rsa"] }
russh-sftp = "3.0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1.3"
subtle = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tower-http = { version = "0.6", features = ["limit"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
