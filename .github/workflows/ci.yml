name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssh-mcp-rs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: rust:1.98.1-bookworm
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install isolated-container test prerequisites
        run: |
          apt-get update
          apt-get install -y --no-install-recommends openssh-server python3 git gh
          mkdir -p /run/sshd
          rustup component add rustfmt clippy
      - name: Formatting
        run: cargo fmt --all --check
      - name: Unit tests
        run: cargo test --all-targets --locked
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Isolated real-SSH and MCP integration
        run: python3 tests/integration.py
